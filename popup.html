<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root{
    --bg0:#05070e; --bg1:#0a0f1f;
    --border:rgba(255,255,255,.10);
    --text:rgba(255,255,255,.92);
    --muted:rgba(255,255,255,.62);
    --accent:#5aa7ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    width:520px;
    font-family:system-ui;
    color:var(--text);
    background:linear-gradient(180deg,var(--bg1),var(--bg0));
  }
  header{
    padding:12px;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(10,15,31,.75);
    backdrop-filter:blur(10px);
  }
  .top{display:flex;justify-content:space-between;gap:10px;align-items:center}
  .title{font-weight:1000;font-size:13px}
  .sub{font-size:11px;color:var(--muted)}
  .chip{
    font-size:11px; padding:6px 10px; border-radius:999px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.04); color:var(--muted);
    white-space:nowrap;
  }
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  button{
    border:1px solid var(--border);
    background:rgba(255,255,255,.04);
    color:var(--text);
    padding:9px 12px;
    border-radius:14px;
    cursor:pointer;
    font-weight:900;
    font-size:12px;
  }
  button.primary{background:rgba(90,167,255,.22);border-color:rgba(90,167,255,.28)}
  main{padding:12px;height:520px;overflow:auto}
  .status{font-size:12px;color:var(--muted);margin-bottom:10px}
  .gallery{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .card{position:relative;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.03)}
  .thumbWrap{aspect-ratio:1/1}
  .thumb{width:100%;height:100%;object-fit:cover}
  .check{position:absolute;top:8px;left:8px;width:18px;height:18px;accent-color:var(--accent)}
  .footer{position:sticky;bottom:0;padding:10px 0 2px;background:linear-gradient(180deg, rgba(5,7,14,0), rgba(5,7,14,.88));display:flex;gap:8px}
  .footer button{flex:1}
</style>
</head>

<body>
<header>
  <div class="top">
    <div>
      <div class="title">Social Image Downloader</div>
      <div class="sub">Live capture • build preview progressive • skip &lt;400×400</div>
    </div>
    <div class="chip"><span id="capCount">0</span> captured</div>
  </div>

  <div class="row">
    <button id="liveToggle">Live ON</button>
    <button class="primary" id="buildPreview">Build Preview</button>
    <button id="selectAll">Select all</button>
    <button id="selectNone">Select none</button>
    <button id="clearCaptured">Clear</button>
  </div>
</header>

<main>
  <div class="status" id="statusText">Live ON → scroll → Build Preview.</div>
  <div id="list" class="gallery"></div>

  <div class="footer">
    <button class="primary" id="downloadSelected">Download selected</button>
    <button id="downloadAll">Download all</button>
  </div>
</main>

<script src="popup.js"></script>
</body>
</html>
