<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root{
    --bg0:#05070e;
    --bg1:#0a0f1f;
    --glass: rgba(255,255,255,.06);
    --glass2: rgba(255,255,255,.09);
    --border: rgba(255,255,255,.10);
    --text: rgba(255,255,255,.92);
    --muted: rgba(255,255,255,.62);
    --muted2: rgba(255,255,255,.44);
    --accent: #5aa7ff;
    --accent2:#7c5cff;
    --good: #2fe08a;
    --bad: #ff5a74;
    --shadow: 0 18px 50px rgba(0,0,0,.55);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    width: 540px;
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
    color: var(--text);
    background:
      radial-gradient(900px 520px at 18% 0%, rgba(90,167,255,.22), transparent 55%),
      radial-gradient(700px 420px at 92% 16%, rgba(124,92,255,.18), transparent 58%),
      radial-gradient(600px 420px at 50% 120%, rgba(47,224,138,.12), transparent 60%),
      linear-gradient(180deg, var(--bg1), var(--bg0));
    overflow:hidden;
  }

  @keyframes popIn { from{opacity:0; transform:translateY(8px) scale(.985)} to{opacity:1; transform:translateY(0) scale(1)} }
  @keyframes pulse { 0%,100%{ transform:scale(1); opacity:.8 } 50%{ transform:scale(1.18); opacity:1 } }
  @keyframes shimmer { 0%{ background-position:-200% 0 } 100%{ background-position:200% 0 } }

  header{
    padding: 12px 12px 10px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    background: linear-gradient(180deg, rgba(10,15,31,.94), rgba(5,7,14,.55));
    backdrop-filter: blur(12px);
  }

  .top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }

  .logo{
    width:38px;height:38px;border-radius:14px;
    background:
      radial-gradient(14px 14px at 30% 30%, rgba(255,255,255,.22), transparent 55%),
      linear-gradient(135deg, rgba(90,167,255,.52), rgba(124,92,255,.30));
    border:1px solid rgba(255,255,255,.14);
    box-shadow: 0 14px 34px rgba(0,0,0,.40);
    flex:0 0 auto;
  }

  .titleWrap{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .title{
    font-weight: 1000;
    font-size: 13px;
    letter-spacing: .25px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .subtitle{
    font-size: 11px;
    color: var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .chips{
    display:flex;
    gap:8px;
    align-items:center;
    flex:0 0 auto;
  }

  .chip{
    font-size: 11px;
    padding: 6px 10px;
    border-radius: 999px;
    border:1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.04);
    color: var(--muted);
    display:flex;
    align-items:center;
    gap:8px;
  }

  .dot{
    width:8px;height:8px;border-radius:999px;
    background: rgba(255,255,255,.22);
    box-shadow: 0 0 0 3px rgba(255,255,255,.06);
  }
  .dot.live{
    background: var(--good);
    box-shadow: 0 0 0 4px rgba(47,224,138,.16);
    animation: pulse 1.2s ease-in-out infinite;
  }

  .gridBtns{
    display:flex;
    gap:8px;
    margin-top: 10px;
    flex-wrap:wrap;
  }

  button{
    border:1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.04);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 14px;
    cursor:pointer;
    font-weight: 950;
    font-size: 12px;
    transition: transform .06s ease, background .15s ease, border .15s ease, box-shadow .15s ease;
    box-shadow: 0 10px 22px rgba(0,0,0,.22);
    user-select:none;
  }
  button:hover{
    background: rgba(255,255,255,.07);
    border-color: rgba(255,255,255,.14);
    box-shadow: 0 14px 30px rgba(0,0,0,.30);
  }
  button:active{ transform: translateY(1px) scale(.995); }

  button.primary{
    background: linear-gradient(135deg, rgba(90,167,255,.30), rgba(124,92,255,.18));
    border-color: rgba(90,167,255,.28);
  }
  button.good{
    background: linear-gradient(135deg, rgba(47,224,138,.22), rgba(90,167,255,.12));
    border-color: rgba(47,224,138,.22);
  }
  button.bad{
    background: rgba(255,90,116,.12);
    border-color: rgba(255,90,116,.22);
  }

  main{
    padding: 12px;
    height: 520px;
    overflow:auto;
  }
  main::-webkit-scrollbar{ width: 10px; }
  main::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.10); border-radius: 999px; border:2px solid rgba(0,0,0,0); background-clip: padding-box; }
  main::-webkit-scrollbar-track{ background: rgba(255,255,255,.03); }

  .statsRow{
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:space-between;
    margin: 2px 0 12px;
  }

  .status{
    font-size: 12px;
    color: var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:1;
  }

  .pill{
    display:flex;
    gap:8px;
    align-items:center;
    padding: 6px 10px;
    border-radius: 999px;
    border:1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.04);
    color: var(--muted);
    font-size: 11px;
    flex:0 0 auto;
  }
  .pill strong{ color: var(--text); font-weight: 950; }

  .gallery{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }

  .card{
    position:relative;
    border-radius: 18px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.03);
    box-shadow: var(--shadow);
    cursor:pointer;
    animation: popIn .18s ease both;
    animation-delay: calc(var(--i, 0) * 10ms);
  }
  .card::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.35));
    opacity:0;
    transition: opacity .18s ease;
    pointer-events:none;
  }
  .card:hover::after{ opacity:1; }

  .thumbWrap{ aspect-ratio:1/1; background: rgba(255,255,255,.03); }
  .thumb{
    width:100%; height:100%;
    object-fit:cover;
    transform: scale(1.0);
    transition: transform .18s ease, filter .18s ease;
    display:block;
  }
  .card:hover .thumb{
    transform: scale(1.06);
    filter: saturate(1.08) contrast(1.05);
  }

  .check{
    position:absolute; top:8px; left:8px;
    width:18px; height:18px;
    accent-color: var(--accent);
    filter: drop-shadow(0 3px 10px rgba(0,0,0,.45));
    z-index: 2;
  }

  .glow{
    position:absolute; inset:-2px;
    border-radius: 20px;
    border: 2px solid rgba(90,167,255,0);
    box-shadow: 0 0 0 rgba(0,0,0,0);
    transition: border-color .18s ease, box-shadow .18s ease;
    pointer-events:none;
    z-index: 1;
  }
  .card.selected .glow{
    border-color: rgba(90,167,255,.70);
    box-shadow: 0 0 0 6px rgba(90,167,255,.14);
  }

  .meta{
    position:absolute;
    left:8px; right:8px; bottom:8px;
    display:flex;
    justify-content:space-between;
    gap:8px;
    z-index:2;
    pointer-events:none;
  }
  .badge{
    font-size:10px;
    padding:4px 7px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.14);
    background: rgba(0,0,0,.40);
    color: rgba(255,255,255,.86);
    backdrop-filter: blur(8px);
    white-space:nowrap;
  }

  .skeleton{
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.03);
    overflow:hidden;
    height:0;
    padding-bottom:100%;
    position:relative;
  }
  .skeleton::before{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(90deg, rgba(255,255,255,.03), rgba(255,255,255,.08), rgba(255,255,255,.03));
    background-size: 200% 100%;
    animation: shimmer 1.1s linear infinite;
  }

  .footer{
    position: sticky;
    bottom: 0;
    padding: 10px 0 2px;
    margin-top: 12px;
    background: linear-gradient(180deg, rgba(5,7,14,0), rgba(5,7,14,.88));
    backdrop-filter: blur(10px);
    display:flex;
    gap:8px;
  }
  .footer button{ flex:1; }

  .toast{
    position: fixed;
    left: 12px;
    bottom: 12px;
    right: 12px;
    padding: 10px 12px;
    border-radius: 14px;
    border:1px solid rgba(255,255,255,.10);
    background: rgba(0,0,0,.35);
    color: rgba(255,255,255,.88);
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
    transform: translateY(10px);
    opacity: 0;
    pointer-events:none;
    transition: opacity .18s ease, transform .18s ease;
  }
  .toast.show{ opacity:1; transform: translateY(0); }

  .hint{
    margin-top: 10px;
    color: var(--muted2);
    font-size: 11px;
    line-height: 1.35;
  }
</style>
</head>

<body>
<header>
  <div class="top">
    <div class="brand">
      <div class="logo"></div>
      <div class="titleWrap">
        <div class="title">Social Image Downloader</div>
        <div class="subtitle" id="subtitle">Live capture • JPG/PNG/WEBP • skip &lt;400×400</div>
      </div>
    </div>

    <div class="chips">
      <div class="chip" title="Site">
        <span class="dot" id="siteDot"></span>
        <span id="siteName">—</span>
      </div>
      <div class="chip" title="Captured URLs">
        <span class="dot" id="liveDot"></span>
        <span><strong id="capCount">0</strong> captured</span>
      </div>
    </div>
  </div>

  <div class="gridBtns">
    <button class="good" id="liveToggle">Live ON</button>
    <button class="primary" id="buildPreview">Build Preview</button>
    <button id="selectAll">Select all</button>
    <button id="selectNone">Select none</button>
    <button class="bad" id="clearCaptured">Clear</button>
  </div>
</header>

<main>
  <div class="statsRow">
    <div class="status" id="statusText">Press Live ON, scroll the page, then Build Preview.</div>
    <div class="pill" title="Shown / Selected">
      <span style="opacity:.75">Shown</span> <strong id="shownCount">0</strong>
      <span style="opacity:.45">•</span>
      <span style="opacity:.75">Selected</span> <strong id="selCount">0</strong>
    </div>
  </div>

  <div id="list" class="gallery"></div>

  <div class="footer">
    <button class="primary" id="downloadSelected">Download selected</button>
    <button id="downloadAll">Download all</button>
  </div>

  <div class="hint">
    Tip: You don’t need to keep this popup open while scrolling. Live capture runs inside the page.
  </div>
</main>

<div class="toast" id="toast"></div>
<script src="popup.js"></script>
</body>
</html>
