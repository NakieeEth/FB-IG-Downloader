<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: Arial, sans-serif; width: 380px; padding: 10px; }
      button { padding: 8px 10px; cursor: pointer; }
      .row { display:flex; gap:8px; margin-bottom:10px; flex-wrap: wrap; }
      #status { font-size: 12px; opacity: 0.85; margin: 6px 0 10px; }
      #list { max-height: 420px; overflow:auto; border:1px solid #ddd; border-radius:8px; padding:8px; }
      .item { display:flex; gap:10px; align-items:center; padding:6px; border-bottom:1px solid #eee; }
      .item:last-child { border-bottom: none; }
      .thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border:1px solid #eee; background:#f6f6f6; }
      .meta { flex:1; }
      .url { font-size: 11px; opacity: 0.8; word-break: break-all; }
      .dim { font-size: 12px; opacity: 0.9; margin-top: 2px; }
      .topline { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
      .small { font-size: 11px; opacity: 0.75; margin-top: 8px; }
      input[type="checkbox"]{ transform: scale(1.1); }
    </style>
  </head>
  <body>
    <div class="topline">
      <strong>FB/IG Image Downloader</strong>
      <button id="refresh">Refresh</button>
    </div>

    <div class="row">
      <button id="selectAll">Select all</button>
      <button id="selectNone">Select none</button>
      <button id="downloadSelected">Download selected</button>
      <button id="downloadAll">Download all</button>
    </div>

    <div id="status">Ready.</div>
    <div id="list"></div>

    <div class="small">
      Notes: FB/IG load content dynamically. Scroll the page to load more images, then click Refresh.
    </div>

    <script src="popup.js"></script>
  </body>
</html>
