<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
:root{
  --bg0:#05070e;
  --bg1:#0a0f1f;
  --border2:rgba(255,255,255,.07);
  --text:rgba(255,255,255,.92);
  --muted:rgba(255,255,255,.64);
  --accent:#5aa7ff;
}
body{
  margin:0;
  width:520px;
  font-family:system-ui;
  color:var(--text);
  background:linear-gradient(180deg,var(--bg1),var(--bg0));
}

header{
  padding:12px;
  border-bottom:1px solid var(--border2);
}

.title{
  font-weight:900;
  font-size:14px;
}

.subtitle{
  font-size:11px;
  color:var(--muted);
}

.btnRow{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

button{
  border:1px solid var(--border2);
  background:rgba(255,255,255,.05);
  color:white;
  padding:9px 12px;
  border-radius:12px;
  cursor:pointer;
  font-weight:800;
  font-size:12px;
}

button.primary{
  background:rgba(90,167,255,.25);
}

main{ padding:12px; }

.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}

.card{
  position:relative;
  border-radius:14px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.1);
}

.thumbWrap{ aspect-ratio:1/1; }
.thumb{
  width:100%;
  height:100%;
  object-fit:cover;
}

.check{
  position:absolute;
  top:6px;
  left:6px;
}

.footer{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.footer button{ flex:1; }

.status{
  margin-top:8px;
  font-size:12px;
  color:var(--muted);
}
</style>
</head>

<body>
<header>
  <div class="title">Social Image Downloader</div>
  <div class="subtitle">Live capture • skip &lt;400×400</div>

  <div class="btnRow">
    <button id="liveStart">Live ON</button>
    <button id="liveStop">Live OFF</button>
    <button class="primary" id="capturedPreview">Build Preview</button>
    <button id="capturedClear">Clear</button>
  </div>
</header>

<main>
  <div id="list" class="grid"></div>

  <div class="footer">
    <button class="primary" id="downloadSelected">Download Selected</button>
    <button id="downloadAll">Download All</button>
  </div>

  <div id="statusText" class="status">Live mode ready.</div>
</main>

<script src="popup.js"></script>
</body>
</html>
